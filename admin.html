<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efe Admin · Snake & Ladder</title><link rel="stylesheet" href="/style.css">
<style>body{padding:20px}.admin-wrap{max-width:900px;margin:24px auto}.admin-card{background:#111b32;border:1px solid #263452;border-radius:18px;padding:22px;margin:16px 0}.admin-card input{width:100%;margin:8px 0 14px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.token-row{border-top:1px solid #263452;padding:14px 0;overflow-wrap:anywhere}.muted{color:#9eacc7;font-size:.9rem}.success{color:#74f0c2}.danger{color:#ff8790}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}}</style></head>
<body><main class="admin-wrap"><div class="eyebrow">PRIVATE OWNER AREA</div><h1>Efe's <span>Token Dashboard</span> 👑</h1><p class="muted">Generate one-time tokens, set redemption validity and access duration, and revoke unused tokens.</p>
<section id="loginCard" class="admin-card"><h2>Admin login</h2><label for="adminPassword">Admin password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Private admin password"><button id="loginBtn" class="btn btn-primary">Log in</button><p id="loginError" class="error-message"></p></section>
<section id="dashboard" class="hidden"><div class="admin-card"><h2>Generate a token</h2><div class="admin-grid"><div><label for="redeemHours">Redeem within (hours)</label><input id="redeemHours" type="number" min="1" max="8760" value="24"></div><div><label for="accessHours">Access duration after redemption (hours)</label><input id="accessHours" type="number" min="1" max="8760" value="168"></div></div><button id="generateBtn" class="btn btn-primary">＋ Generate one-time token</button><p id="generatedToken" class="success"></p><button id="copyTokenBtn" class="btn btn-secondary hidden">Copy token</button><p class="muted">Copy and share each token privately. It can be redeemed once.</p></div><div class="admin-card"><h2>Token history</h2><button id="refreshBtn" class="btn btn-secondary">Refresh list</button><div id="tokenList"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let adminToken=sessionStorage.getItem("efe_admin_token")||"",latestToken="";
async function api(url,method="GET",body){const r=await fetch(url,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+adminToken},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Request failed");return d}
function date(ts){return ts?new Date(ts).toLocaleString():"—"}function duration(ms){const h=Math.round(ms/3600000);return h>=24?(h/24)+" day(s)":h+" hour(s)"}
async function loadTokens(){try{const d=await api("/api/admin/tokens");$("tokenList").innerHTML=d.tokens.length?d.tokens.slice().reverse().map(t=>`<div class="token-row"><strong>${t.code}</strong><br><span class="muted">Redeem by: ${date(t.redeemBy)} · Access: ${duration(t.accessDurationMs)}</span><br><span class="${t.revokedAt?'danger':t.redeemedAt?'muted':'success'}">${t.revokedAt?'Revoked':t.redeemedAt?'Redeemed by '+t.redeemedBy+' · ends '+date(t.accessExpiresAt):'Unused'}</span>${!t.redeemedAt&&!t.revokedAt?`<br><button class="btn btn-secondary" data-revoke="${t.code}">Revoke token</button>`:""}</div>`).join(""):"<p class='muted'>No tokens generated yet.</p>";document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(confirm("Revoke this token?")){try{await api("/api/admin/revoke","POST",{token:b.dataset.revoke});await loadTokens()}catch(e){alert(e.message)}}})}catch(e){$("tokenList").textContent=e.message}}
async function login(){try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("adminPassword").value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Login failed");adminToken=d.adminToken;sessionStorage.setItem("efe_admin_token",adminToken);$("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");loadTokens()}catch(e){$("loginError").textContent=e.message}}
$("loginBtn").onclick=login;$("adminPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("generateBtn").onclick=async()=>{try{const d=await api("/api/admin/tokens","POST",{redeemHours:Number($("redeemHours").value),accessHours:Number($("accessHours").value)});latestToken=d.token.code;$("generatedToken").textContent="New token: "+latestToken+" — copy it now and share privately.";$("copyTokenBtn").classList.remove("hidden");await loadTokens()}catch(e){alert(e.message)}};
$("copyTokenBtn").onclick=async()=>{try{await navigator.clipboard.writeText(latestToken);$("copyTokenBtn").textContent="Copied!"}catch{$("generatedToken").textContent="Copy manually: "+latestToken}};
$("refreshBtn").onclick=loadTokens;if(adminToken){$("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");loadTokens()}
</script></body></html>
